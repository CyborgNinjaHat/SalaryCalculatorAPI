name: Code Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Check formatting
        run: pnpm format

      - name: Build packages
        run: pnpm build

      - name: Check linting
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test:cov

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run e2e tests
        run: pnpm test:e2e
